# ═══════════════════════════════════════════════════════════
# 13-deploy-residuos.conf - hardening SSH para `deploy-residuos`
# Instalar en: /etc/ssh/sshd_config.d/13-deploy-residuos.conf
#
# Usuario exclusivo del CI/CD de Residuos 2184. Least privilege:
# - ForceCommand: siempre ejecuta el wrapper (ignora comando del cliente)
# - Sin TTY, sin forwarding, sin environment, sin password
# ═══════════════════════════════════════════════════════════

# AllowUsers se acumula entre archivos: el 05-global-hardening.conf ya
# limita a morfeo/deploy/deploy-etp; esta línea suma el usuario nuevo.
AllowUsers deploy-residuos

Match User deploy-residuos
    # Forzar el wrapper script, ignorar cualquier comando del cliente
    ForceCommand /usr/local/bin/residuos-deploy
    # Sin shell interactivo, sin TTY
    PermitTTY no
    # Sin forwarding de ningún tipo
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    # Solo key auth (no password)
    PasswordAuthentication no
    # Sin gateway ports
    GatewayPorts no
