[package]
name = "residuos-web"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "DataTransfer",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FormData",
  "HtmlInputElement",
  "Url",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
